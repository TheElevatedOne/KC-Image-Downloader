name: Build And Release

# Builds the Chrome and Firefox zips, lints the extension with Mozilla's web-ext and, when the AMO API key is
# set as repository secrets (AMO_JWT_ISSUER, AMO_JWT_SECRET), has Mozilla sign the Firefox build as an unlisted
# add-on. Release Firefox only installs signed add-ons. A pushed tag also publishes a GitHub release.

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}

    steps:
    - name: Check-out repository
      uses: actions/checkout@v7

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: 22

    - name: Read version from manifest
      id: getversion
      run: echo "version=$(node -p "require('./extension/manifest.json').version")" >> "$GITHUB_OUTPUT"

    - name: Build zips
      run: ./build.sh

    - name: Lint with web-ext
      run: npx --yes web-ext@8 lint --source-dir extension --self-hosted

    - name: Sign Firefox build (unlisted)
      if: env.AMO_JWT_ISSUER != '' && env.AMO_JWT_SECRET != ''
      run: |
        npx --yes web-ext@8 sign --source-dir extension --channel unlisted \
          --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET" --artifacts-dir dist/signed
        mv dist/signed/*.xpi "dist/kc-image-downloader-${{ steps.getversion.outputs.version }}-firefox.xpi"

    - name: Upload build
      uses: actions/upload-artifact@v7
      with:
        name: kc-image-downloader-${{ steps.getversion.outputs.version }}
        path: |
          dist/*.zip
          dist/*.xpi
        if-no-files-found: error

    - name: Create Github Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: ncipollo/release-action@v1.20.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        artifacts: dist/*.zip,dist/*.xpi
        replacesArtifacts: false
        name: v${{ steps.getversion.outputs.version }} - KC Image Downloader
        allowUpdates: true
        tag: ${{ github.ref_name }}
        commit: ${{ github.sha }}
        omitBody: true
